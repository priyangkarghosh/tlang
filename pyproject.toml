[project]
name = "tlang"
version = "1.3.26"
description = "GLSL Shader Preprocessor with modern language features."
authors = [{ name = "Priyangkar Ghosh", email = "priyangkar.ghosh@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["glsl", "shader", "preprocessor", "moderngl", "opengl", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    # 5.12 is the verified floor. Beyond the Buffer/ComputeShader/StorageBlock
    # surface, tlang relies on StorageBlock/UniformBlock `.binding` being
    # writable post-link and on samplers/images reflecting as `Uniform` with a
    # writable `.value` -- both are how bindings and texture units get assigned
    # without hardcoding an index in the GLSL.
    "moderngl>=5.12",
    "jinja2",
    "regex",
    "bitarray",
    "PyOpenGL",
    "PyOpenGL-accelerate",
    # Decoding the debug log is host-bound, not GPU-bound: 100k records take ~48ms
    # through struct, which blows a frame budget. numpy vectorises that.
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/priyangkarghosh/tlang"
Repository = "https://github.com/priyangkarghosh/tlang"
Issues = "https://github.com/priyangkarghosh/tlang/issues"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.egg-info", "build*", "dist*"]

[tool.setuptools.package-data]
tlang = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gl: requires a live OpenGL context",
]
